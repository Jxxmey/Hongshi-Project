<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- แก้ไขบรรทัดนี้: เปลี่ยนชื่อไฟล์และประเภทให้เป็น png -->
    <link rel="icon" type="image/png" href="/assets/logo.png?v=2" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hongshi Day</title>

    <!-- ========================================== -->
    <!-- Meta Tags สำหรับการแชร์ลง Social Media -->
    <!-- ========================================== -->
    
    <!-- ข้อมูลพื้นฐาน -->
    <meta name="description" content="ร่วมฉลองวันเกิดฮงชิ (Hong LYKN) และส่งคำอวยพรผ่าน Guestbook พร้อมติดตามรายละเอียดโปรเจกต์คาเฟ่ได้ที่นี่! 🩵" />

    <!-- สำหรับ Facebook, LINE, และเว็บทั่วไป (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Happy Hongshihoshi Day 2026 🎂" />
    <meta property="og:description" content="ร่วมฉลองวันเกิดฮงชิ (Hong LYKN) และส่งคำอวยพรผ่าน Guestbook พร้อมติดตามรายละเอียดโปรเจกต์คาเฟ่ได้ที่นี่! 🩵" />
    
    <!-- 🚨 สำคัญมาก: รูปภาพปก (Preview) ต้องใช้เป็นลิงก์เว็บจริงแบบเต็มๆ เท่านั้น (Absolute URL) ระบบถึงจะดึงรูปไปโชว์ได้ครับ 
         (ตัวอย่าง: https://hongshi-day.onrender.com/assets/share-preview.jpg) -->
    <meta property="og:image" content="https://hongshi-project.onrender.com/assets/share-preview.jpg" />

    <!-- สำหรับ X (Twitter Cards) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Happy Hongshihoshi Day 2026 🎂" />
    <meta name="twitter:description" content="มาร่วมส่งคำอวยพรวันเกิดให้ฮงชิ พร้อมดูรายละเอียดโปรเจกต์ต่างๆ ได้ที่เว็บเลยครับ 🩵" />
    <meta name="twitter:image" content="https://hongshi-project.onrender.com//assets/share-preview.jpg" />
    
    <!-- ========================================== -->
    
    <!-- นำเข้าฟอนต์ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=K2D:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
